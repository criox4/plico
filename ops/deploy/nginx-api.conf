# /etc/nginx/sites-available/plico-api (symlinked into sites-enabled). The API sits behind Cloudflare's proxy:
# only Cloudflare may connect, and the visitor's address comes from CF-Connecting-IP, which only Cloudflare can set.
# Needs /etc/nginx/cloudflare-{geo,realip}.conf from cloudflare-ips.sh. Certificate: `certbot certonly --nginx -d api.plico.space` before enabling this file.
geo $realip_remote_addr $plico_from_cf {
  default 0;
  include /etc/nginx/cloudflare-geo.conf;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.plico.space;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;        # nginx 1.24 syntax; 1.25+ prefers `http2 on;`
  listen [::]:443 ssl http2;
  server_name api.plico.space;
  ssl_certificate /etc/letsencrypt/live/api.plico.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.plico.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  include /etc/nginx/cloudflare-realip.conf;
  if ($plico_from_cf = 0) { return 403; }

  client_max_body_size 10m;   # the largest API body is 8 MB (a photo in Ask Plico)

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # the visitor, after real_ip; the API reads it via CLIENT_IP_HEADER
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 100s;                   # Cloudflare's own limit
  }
}
