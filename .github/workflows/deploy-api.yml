# main → checks → image on GHCR → the API host pulls it (ops/deploy/deploy.sh rolls back if /health never passes).
# The web app deploys separately: Vercel builds main on its own.
name: Deploy API
on:
  push:
    branches: [main]
    paths: [server/**, src/**, prisma/**, package.json, package-lock.json, prisma.config.ts, tsconfig.json, Dockerfile, ops/deploy/**, .github/workflows/deploy-api.yml]
  workflow_dispatch:

concurrency: { group: deploy-api, cancel-in-progress: false }

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/criox4/plico-api:${{ github.sha }},ghcr.io/criox4/plico-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: read }
    steps:
      - name: SSH setup
        env: { KEY: "${{ secrets.DEPLOY_SSH_KEY }}", KNOWN: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      # The key can only run ops/deploy/gate.sh on the host: `deploy <sha>`, with a GHCR token on stdin.
      - name: Deploy
        env: { HOST: "${{ secrets.DEPLOY_HOST }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}", SHA: "${{ github.sha }}" }
        run: printf '%s' "$TOKEN" | ssh "root@$HOST" "deploy $SHA"
