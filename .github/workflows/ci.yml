name: CI
on:
  push: { branches: [dev, main] }
  pull_request:
  workflow_call:

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://ci@localhost/ci   # prisma generate reads its config; no database is used
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
